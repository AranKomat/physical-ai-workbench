name: CPU contract and reference tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow PyYAML safetensors pytest
          python -m pip install -e . --no-deps
      - name: Validate contracts and tiny reference model
        run: bash scripts/validate_cpu.sh
      - name: Save CPU reports, never label them GPU/model benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-contract-reports
          path: |
            artifacts/pytest.xml
            artifacts/pytest.txt
            artifacts/cpu_smoke/report.json
            artifacts/cpu_self_parity.json
